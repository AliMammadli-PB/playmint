# Enable only after games.playmint.tr DNS resolves to this host and TLS is provisioned.
server {
 listen 443 ssl;
 server_name games.playmint.tr;
 ssl_certificate /etc/letsencrypt/live/games.playmint.tr/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/games.playmint.tr/privkey.pem;
 location / {
  proxy_set_header Host games.playmint.tr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host games.playmint.tr;
  proxy_pass http://127.0.0.1:3020/game-runtime/;
 }
}
